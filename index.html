<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4cbd7"><title>抓大鹅 · 美妆梳妆台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#51313d;background:radial-gradient(circle at 15% 10%,#fff3f7,#ebbdcf 68%,#cd91a9);min-height:100dvh;display:grid;place-items:center}.game{position:relative;width:min(100vw,460px);height:min(100dvh,850px);min-height:590px;overflow:hidden;background:linear-gradient(130deg,#f9e5e9,#eab7cb 52%,#f6d7dd);box-shadow:0 15px 60px #76385066;touch-action:manipulation}.game:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 78px,#fff4 79px 80px),radial-gradient(circle at 18% 75%,#fff8,transparent 30%);pointer-events:none}.top{position:absolute;z-index:3;left:0;right:0;top:0;padding:env(safe-area-inset-top) 15px 0;display:flex;align-items:center;justify-content:space-between;height:72px}.round,.timer,.badge{background:#fff9;border:1px solid #fff9;box-shadow:0 4px 12px #93556a28;border-radius:24px;padding:9px 14px;font-weight:800}.round{font-size:13px}.timer{font-size:19px;font-variant-numeric:tabular-nums}.pause{border:0;background:#fff9;border-radius:50%;width:39px;height:39px;color:#914d69;font-size:18px}.headline{position:absolute;top:78px;left:0;right:0;text-align:center;z-index:2}.headline h1{margin:0;color:#913a60;font-size:clamp(24px,7vw,33px);text-shadow:0 2px #fff}.headline p{margin:4px 0;font-size:12px;font-weight:700;color:#8b6473}.mirror{position:absolute;top:17%;height:59%;width:112%;left:-6%;background:radial-gradient(ellipse at 46% 28%,#f9ecf1,#e5c3d0 73%,#ad738c 77%,#89556e 82%,#6b3f57 90%);border-radius:49% 49% 45% 45%;box-shadow:inset 0 12px 30px #4c223b66,0 15px 30px #713d5759;border:9px solid #b67d96;overflow:hidden}.mirror:before{content:"";position:absolute;inset:7%;border:2px solid #fff6;border-radius:50%;pointer-events:none}.tray-art{position:absolute;bottom:0;left:0;right:0;height:28%;background:linear-gradient(#f8e6dd,#d4999b);border-top:7px solid #fff6;box-shadow:0 -10px 25px #ac697644}.counter{position:absolute;z-index:3;bottom:21.5%;width:100%;text-align:center;font-weight:800;font-size:13px}.slots{position:absolute;z-index:4;bottom:14.5%;left:4%;width:92%;display:flex;gap:3px}.slot{height:46px;flex:1;min-width:0;background:#fff9;border:2px solid #bc899d;border-radius:8px;display:grid;place-items:center;font-size:27px;box-shadow:inset 0 3px 7px #a66c8644}.tools{position:absolute;z-index:3;bottom:3.5%;left:5%;right:5%;display:flex;justify-content:space-around;gap:8px}.tools button{flex:1;max-width:125px;border:2px solid #fff9;background:linear-gradient(#ffc6d8,#e790b0);border-radius:15px;padding:8px 2px;color:#63324a;font-size:13px;font-weight:800;box-shadow:0 5px #b76c8a}.tools button:active{transform:translateY(3px);box-shadow:0 2px #b76c8a}.piece{position:absolute;display:grid;place-items:center;border:0;background:transparent;padding:0;cursor:pointer;user-select:none;filter:drop-shadow(2px 5px 3px #50283c88);transition:transform .16s,left .28s,top .28s,opacity .2s}.piece svg{width:100%;height:100%;overflow:visible}.slot svg{width:38px;height:38px;filter:drop-shadow(1px 2px 2px #6c354c66)}.piece:active{transform:scale(1.18)}.piece.selected{z-index:999!important;transform:scale(1.4);filter:drop-shadow(0 0 10px #fff)}.piece[disabled]{pointer-events:none}.modal{position:absolute;inset:0;z-index:1000;background:#5b2b4a99;display:grid;place-items:center;padding:22px}.modal.hidden{display:none}.card{width:min(100%,330px);padding:27px 20px;background:#fff4f6;border:4px solid #f6b5d0;border-radius:25px;text-align:center;box-shadow:0 15px 45px #44223370}.card h2{margin:0 0 10px;color:#9a4368;font-size:26px}.card p{line-height:1.6}.card button{border:0;border-radius:25px;padding:12px 28px;background:#a94872;color:white;font-weight:800;font-size:16px}.hint{position:absolute;bottom:0;left:0;right:0;text-align:center;color:#fff;font-size:11px;opacity:.9}@media(max-height:660px){.headline{top:66px}.headline h1{font-size:24px}.mirror{top:18%;height:55%}.counter{bottom:21%}.slot{height:38px}.tools{bottom:2%}}
</style></head><body><main class="game"><div class="top"><span class="round" id="round">第 1 关</span><span class="timer" id="timer">不限时</span><button class="pause" id="pause" aria-label="暂停">Ⅱ</button></div><div class="headline"><h1>美妆梳妆台</h1><p>点选物品 · 三个相同即可消除</p></div><div class="mirror" id="board"></div><div class="tray-art"></div><div class="counter" id="counter"></div><div class="slots" id="slots"></div><div class="tools"><button id="undo">↶ 撤回 <small id="undoCount">×3</small></button><button id="shuffle">⤨ 洗牌 <small id="shuffleCount">×3</small></button><button id="remove">✦ 移出 <small id="removeCount">×3</small></button></div><div class="modal" id="modal"><div class="card"><h2 id="modalTitle">美妆挑战</h2><p id="modalText">从上层开始拿走美妆物品，凑齐三个相同物品即可消除。七格放满则挑战失败。</p><button id="modalButton">开始挑战</button></div></div></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),board=$('#board'),slots=$('#slots');function art(type){const shapes={"💄":"<rect x=\"19\" y=\"28\" width=\"22\" height=\"27\" rx=\"3\" fill=\"#a52857\"/><path d=\"M21 28V16q9-12 18 0v12Z\" fill=\"#e95278\"/><path d=\"M21 19q9-5 18 0\" stroke=\"#ff9bad\" stroke-width=\"2\" fill=\"none\"/><rect x=\"19\" y=\"43\" width=\"22\" height=\"4\" fill=\"#e9b967\"/>","💋":"<path d=\"M5 29q8-11 17-8 8 2 9 2 10-6 22 5-14 21-25 20Q15 47 5 29Z\" fill=\"#d9476f\" stroke=\"#9c2f55\" stroke-width=\"2\"/><path d=\"M9 30q17 8 43 0\" stroke=\"#912447\" stroke-width=\"3\" fill=\"none\"/>","🪞":"<ellipse cx=\"29\" cy=\"24\" rx=\"20\" ry=\"21\" fill=\"#d7aa76\" stroke=\"#a06a53\" stroke-width=\"3\"/><ellipse cx=\"29\" cy=\"24\" rx=\"15\" ry=\"16\" fill=\"#bce3ea\"/><path d=\"M18 22l16-12M17 30l23-19\" stroke=\"#fff\" stroke-width=\"2\" opacity=\".75\"/><rect x=\"25\" y=\"44\" width=\"8\" height=\"13\" rx=\"3\" fill=\"#b47b9e\"/>","🧴":"<rect x=\"21\" y=\"5\" width=\"17\" height=\"8\" rx=\"2\" fill=\"#8c5f7b\"/><path d=\"M29 5V2h18v4\" stroke=\"#8c5f7b\" stroke-width=\"4\" fill=\"none\"/><rect x=\"14\" y=\"14\" width=\"30\" height=\"42\" rx=\"7\" fill=\"#e6a6bc\" stroke=\"#ad708d\" stroke-width=\"2\"/><rect x=\"18\" y=\"26\" width=\"22\" height=\"20\" rx=\"3\" fill=\"#fff2e8\"/>","💅":"<rect x=\"17\" y=\"24\" width=\"26\" height=\"31\" rx=\"6\" fill=\"#d44b77\" stroke=\"#922e58\" stroke-width=\"2\"/><rect x=\"23\" y=\"7\" width=\"14\" height=\"18\" rx=\"2\" fill=\"#343047\"/><path d=\"M20 28v20\" stroke=\"#ffb2c8\" stroke-width=\"3\"/>","🖌️":"<g transform=\"rotate(-35 30 30)\"><rect x=\"26\" y=\"22\" width=\"8\" height=\"35\" rx=\"3\" fill=\"#a66a76\"/><rect x=\"25\" y=\"19\" width=\"10\" height=\"7\" fill=\"#e8bc79\"/><path d=\"M25 19q-4-13 5-18 9 5 5 18Z\" fill=\"#4d3949\"/></g>","🧽":"<path d=\"M8 27q3-16 19-18 17-3 24 11 6 14-5 27-10 13-24 7Q5 51 8 27Z\" fill=\"#e7b9a1\" stroke=\"#bd8d89\" stroke-width=\"2\"/><circle cx=\"18\" cy=\"34\" r=\"2\" fill=\"#c89188\"/><circle cx=\"36\" cy=\"28\" r=\"3\" fill=\"#c89188\"/>","👁️":"<rect x=\"5\" y=\"10\" width=\"50\" height=\"42\" rx=\"9\" fill=\"#b67896\" stroke=\"#814b6a\" stroke-width=\"2\"/><rect x=\"9\" y=\"14\" width=\"42\" height=\"34\" rx=\"6\" fill=\"#f8dae5\"/><circle cx=\"20\" cy=\"26\" r=\"7\" fill=\"#be7599\"/><circle cx=\"39\" cy=\"26\" r=\"7\" fill=\"#d5a968\"/><circle cx=\"20\" cy=\"39\" r=\"6\" fill=\"#d98a8e\"/><circle cx=\"39\" cy=\"39\" r=\"6\" fill=\"#9e718c\"/>","🎀":"<path d=\"M30 27Q-3 1 6 28q3 13 23 4Q55 10 55 26q2 14-24 7Z\" fill=\"#ee87ad\" stroke=\"#a64c7a\" stroke-width=\"2\"/><rect x=\"24\" y=\"23\" width=\"12\" height=\"14\" rx=\"3\" fill=\"#ad4e7a\"/><path d=\"M25 36L14 55l16-8 14 8-8-19\" fill=\"#ee87ad\" stroke=\"#a64c7a\" stroke-width=\"2\"/>","🧼":"<rect x=\"7\" y=\"17\" width=\"46\" height=\"33\" rx=\"14\" fill=\"#ffe8df\" stroke=\"#c995ab\" stroke-width=\"3\"/><path d=\"M15 28q8-8 22-6\" stroke=\"#fff\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"44\" cy=\"10\" r=\"5\" fill=\"#d9f1f1\"/>","🌸":"<g fill=\"#f2a7c3\" stroke=\"#ca749d\" stroke-width=\"1.5\"><ellipse cx=\"30\" cy=\"16\" rx=\"9\" ry=\"13\"/><ellipse cx=\"43\" cy=\"26\" rx=\"9\" ry=\"13\" transform=\"rotate(72 43 26)\"/><ellipse cx=\"38\" cy=\"43\" rx=\"9\" ry=\"13\" transform=\"rotate(145 38 43)\"/><ellipse cx=\"20\" cy=\"43\" rx=\"9\" ry=\"13\" transform=\"rotate(215 20 43)\"/><ellipse cx=\"16\" cy=\"26\" rx=\"9\" ry=\"13\" transform=\"rotate(288 16 26)\"/></g><circle cx=\"30\" cy=\"30\" r=\"8\" fill=\"#f4ce73\"/>","🪮":"<path d=\"M8 15q22-10 44 0v12H8Z\" fill=\"#ba7a83\" stroke=\"#80505b\" stroke-width=\"2\"/><path d=\"M10 27v29m6-29v29m6-29v29m6-29v29m6-29v29m6-29v29m6-29v29m6-29v29\" stroke=\"#80505b\" stroke-width=\"3\" stroke-linecap=\"round\"/>"};return '<svg viewBox="0 0 60 60" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">'+shapes[type]+'</svg>'}const symbols=['💄','💋','🪞','🧴','💅','🖌️','🧽','👁️','🎀','🧼','🌸','🪮'];let items=[],tray=[],history=[],remaining=166,round=1,running=false,paused=false,timerId=null,counts={undo:3,shuffle:3,remove:3};const rand=n=>Math.floor(Math.random()*n);function ui(){slots.replaceChildren();for(let i=0;i<7;i++){const s=document.createElement('div');s.className='slot';if(tray[i])s.innerHTML=art(tray[i]);slots.append(s)}$('#counter').textContent=`还剩 ${items.length} 件 · 已消除 ${remaining-items.length} 件`;for(const k of Object.keys(counts))$('#'+k+'Count').textContent='×'+counts[k]}function modal(title,message,button,callback){$('#modalTitle').textContent=title;$('#modalText').textContent=message;$('#modalButton').textContent=button;$('#modalButton').onclick=()=>{$('#modal').classList.add('hidden');callback()};$('#modal').classList.remove('hidden')}function start(){clearInterval(timerId);board.replaceChildren();tray=[];history=[];counts={undo:3,shuffle:3,remove:3};remaining=round===1?90:120;let pool=[];for(let i=0;i<remaining/3;i++){const type=symbols[rand(Math.min(symbols.length,7+round))];pool.push(type,type,type)}pool.sort(()=>Math.random()-.5);items=[];const w=board.clientWidth,h=board.clientHeight,size=Math.min(58,w*.15);for(let i=0;i<remaining;i++){const layer=Math.floor(i/(remaining/3));const angle=(i*2.39996)+rand(100)*.01,r=Math.sqrt(Math.random())*(Math.min(w*.41,h*.42)-size*.5);const x=Math.max(2,Math.min(w-size-2,w*.5+Math.cos(angle)*r-size/2)),y=Math.max(5,Math.min(h-size-5,h*.49+Math.sin(angle)*r-size/2));const el=document.createElement('button');el.className='piece';el.type='button';el.style.cssText=`width:${size}px;height:${size}px;left:${x}px;top:${y}px;z-index:${i+1}`;el.innerHTML=art(pool[i]);el.setAttribute('aria-label',pool[i]);const item={id:i,type:pool[i],x,y,el};el.onclick=()=>take(item);board.append(el);items.push(item)}$('#round').textContent=`第 ${round} 关`;running=true;paused=false;$('#pause').textContent='Ⅱ';ui()}function take(item){if(!running||paused||!items.includes(item))return;history.push({type:item.type,item,before:[...tray]});item.el.remove();items=items.filter(x=>x!==item);tray.push(item.type);if(tray.filter(x=>x===item.type).length===3)tray=tray.filter(x=>x!==item.type);ui();if(!items.length){finish(true);return}if(tray.length>=7)finish(false,'收纳格满了，再挑战一次吧！')}function finish(win,reason){running=false;clearInterval(timerId);modal(win?'通关成功！':'挑战结束',win?'梳妆台清空啦！准备进入下一关吗？':reason,win?'下一关':'再试一次',()=>{if(win)round++;start()})}$('#modalButton').onclick=()=>{$('#modal').classList.add('hidden');start()};$('#pause').onclick=()=>{if(!running)return;paused=!paused;$('#pause').textContent=paused?'▶':'Ⅱ';if(paused)modal('已暂停','整理一下思路，继续寻找三个相同的美妆物品。','继续游戏',()=>{paused=false;$('#pause').textContent='Ⅱ'})};$('#undo').onclick=()=>{if(!running||paused||!history.length||!counts.undo)return;const last=history.pop();counts.undo--;tray=last.before;last.item.el.style.zIndex=String(remaining+history.length+1);board.append(last.item.el);items.push(last.item);ui()};$('#shuffle').onclick=()=>{if(!running||paused||!counts.shuffle)return;counts.shuffle--;const types=items.map(x=>x.type).sort(()=>Math.random()-.5);items.forEach((item,i)=>{item.type=types[i];item.el.innerHTML=art(types[i]);item.el.setAttribute('aria-label',types[i])});ui()};$('#remove').onclick=()=>{if(!running||paused||!counts.remove||!tray.length)return;counts.remove--;tray.splice(0,Math.min(3,tray.length));ui()};ui()})();
</script></body></html>
