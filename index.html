<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4cbd7"><title>抓大鹅 · 美妆梳妆台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#51313d;background:radial-gradient(circle at 15% 10%,#fff3f7,#ebbdcf 68%,#cd91a9);min-height:100dvh;display:grid;place-items:center}.game{position:relative;width:min(100vw,460px);height:min(100dvh,850px);min-height:590px;overflow:hidden;background:linear-gradient(130deg,#f9e5e9,#eab7cb 52%,#f6d7dd);box-shadow:0 15px 60px #76385066;touch-action:manipulation}.game:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 78px,#fff4 79px 80px),radial-gradient(circle at 18% 75%,#fff8,transparent 30%);pointer-events:none}.top{position:absolute;z-index:3;left:0;right:0;top:0;padding:env(safe-area-inset-top) 15px 0;display:flex;align-items:center;justify-content:space-between;height:72px}.round,.timer,.badge{background:#fff9;border:1px solid #fff9;box-shadow:0 4px 12px #93556a28;border-radius:24px;padding:9px 14px;font-weight:800}.round{font-size:13px}.timer{font-size:19px;font-variant-numeric:tabular-nums}.pause{border:0;background:#fff9;border-radius:50%;width:39px;height:39px;color:#914d69;font-size:18px}.headline{position:absolute;top:78px;left:0;right:0;text-align:center;z-index:2}.headline h1{margin:0;color:#913a60;font-size:clamp(24px,7vw,33px);text-shadow:0 2px #fff}.headline p{margin:4px 0;font-size:12px;font-weight:700;color:#8b6473}.mirror{position:absolute;top:17%;height:59%;width:112%;left:-6%;background:radial-gradient(ellipse at 46% 28%,#f9ecf1,#e5c3d0 73%,#ad738c 77%,#89556e 82%,#6b3f57 90%);border-radius:49% 49% 45% 45%;box-shadow:inset 0 12px 30px #4c223b66,0 15px 30px #713d5759;border:9px solid #b67d96;overflow:hidden}.mirror:before{content:"";position:absolute;inset:7%;border:2px solid #fff6;border-radius:50%;pointer-events:none}.tray-art{position:absolute;bottom:0;left:0;right:0;height:28%;background:linear-gradient(#f8e6dd,#d4999b);border-top:7px solid #fff6;box-shadow:0 -10px 25px #ac697644}.counter{position:absolute;z-index:3;bottom:21.5%;width:100%;text-align:center;font-weight:800;font-size:13px}.slots{position:absolute;z-index:4;bottom:14.5%;left:4%;width:92%;display:flex;gap:3px}.slot{height:46px;flex:1;min-width:0;background:#fff9;border:2px solid #bc899d;border-radius:8px;display:grid;place-items:center;font-size:27px;box-shadow:inset 0 3px 7px #a66c8644}.tools{position:absolute;z-index:3;bottom:3.5%;left:5%;right:5%;display:flex;justify-content:space-around;gap:8px}.tools button{flex:1;max-width:125px;border:2px solid #fff9;background:linear-gradient(#ffc6d8,#e790b0);border-radius:15px;padding:8px 2px;color:#63324a;font-size:13px;font-weight:800;box-shadow:0 5px #b76c8a}.tools button:active{transform:translateY(3px);box-shadow:0 2px #b76c8a}.piece{position:absolute;display:grid;place-items:center;border:2px solid #fff8;background:linear-gradient(135deg,#fffaf5,#eab9cb);box-shadow:2px 5px 5px #50283c66,inset 0 2px 3px #fff;cursor:pointer;user-select:none;border-radius:14px;font-size:clamp(25px,8vw,40px);transition:transform .16s,left .28s,top .28s,opacity .2s}.piece:active{transform:scale(1.18)}.piece.selected{z-index:999!important;transform:scale(1.4);box-shadow:0 4px 25px #fff}.piece[disabled]{pointer-events:none}.modal{position:absolute;inset:0;z-index:1000;background:#5b2b4a99;display:grid;place-items:center;padding:22px}.modal.hidden{display:none}.card{width:min(100%,330px);padding:27px 20px;background:#fff4f6;border:4px solid #f6b5d0;border-radius:25px;text-align:center;box-shadow:0 15px 45px #44223370}.card h2{margin:0 0 10px;color:#9a4368;font-size:26px}.card p{line-height:1.6}.card button{border:0;border-radius:25px;padding:12px 28px;background:#a94872;color:white;font-weight:800;font-size:16px}.hint{position:absolute;bottom:0;left:0;right:0;text-align:center;color:#fff;font-size:11px;opacity:.9}@media(max-height:660px){.headline{top:66px}.headline h1{font-size:24px}.mirror{top:18%;height:55%}.counter{bottom:21%}.slot{height:38px}.tools{bottom:2%}}
</style></head><body><main class="game"><div class="top"><span class="round" id="round">第 1 关</span><span class="timer" id="timer">02:46</span><button class="pause" id="pause" aria-label="暂停">Ⅱ</button></div><div class="headline"><h1>美妆梳妆台</h1><p>点选物品 · 三个相同即可消除</p></div><div class="mirror" id="board"></div><div class="tray-art"></div><div class="counter" id="counter"></div><div class="slots" id="slots"></div><div class="tools"><button id="undo">↶ 撤回 <small id="undoCount">×3</small></button><button id="shuffle">⤨ 洗牌 <small id="shuffleCount">×3</small></button><button id="remove">✦ 移出 <small id="removeCount">×3</small></button></div><div class="modal" id="modal"><div class="card"><h2 id="modalTitle">美妆挑战</h2><p id="modalText">从上层开始拿走美妆物品，凑齐三个相同物品即可消除。七格放满则挑战失败。</p><button id="modalButton">开始挑战</button></div></div></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),board=$('#board'),slots=$('#slots');const symbols=['💄','💋','🪞','🧴','💅','🖌️','🧽','👁️','🎀','🧼','🌸','🪮'];let items=[],tray=[],history=[],remaining=166,round=1,running=false,paused=false,timerId=null,counts={undo:3,shuffle:3,remove:3};const rand=n=>Math.floor(Math.random()*n);function ui(){slots.replaceChildren();for(let i=0;i<7;i++){const s=document.createElement('div');s.className='slot';s.textContent=tray[i]||'';slots.append(s)}$('#counter').textContent=`还剩 ${items.length} 件 · 已消除 ${remaining-items.length} 件`;for(const k of Object.keys(counts))$('#'+k+'Count').textContent='×'+counts[k]}function modal(title,message,button,callback){$('#modalTitle').textContent=title;$('#modalText').textContent=message;$('#modalButton').textContent=button;$('#modalButton').onclick=()=>{$('#modal').classList.add('hidden');callback()};$('#modal').classList.remove('hidden')}function start(){clearInterval(timerId);board.replaceChildren();tray=[];history=[];counts={undo:3,shuffle:3,remove:3};remaining=round===1?90:120;let pool=[];for(let i=0;i<remaining/3;i++){const type=symbols[rand(Math.min(symbols.length,7+round))];pool.push(type,type,type)}pool.sort(()=>Math.random()-.5);items=[];const w=board.clientWidth,h=board.clientHeight,size=Math.min(58,w*.15);for(let i=0;i<remaining;i++){const layer=Math.floor(i/(remaining/3));const angle=(i*2.39996)+rand(100)*.01,r=Math.sqrt(Math.random())*(Math.min(w*.41,h*.42)-size*.5);const x=Math.max(2,Math.min(w-size-2,w*.5+Math.cos(angle)*r-size/2)),y=Math.max(5,Math.min(h-size-5,h*.49+Math.sin(angle)*r-size/2));const el=document.createElement('button');el.className='piece';el.type='button';el.style.cssText=`width:${size}px;height:${size}px;left:${x}px;top:${y}px;z-index:${i+1}`;el.textContent=pool[i];el.setAttribute('aria-label',pool[i]);const item={id:i,type:pool[i],x,y,el};el.onclick=()=>take(item);board.append(el);items.push(item)}let seconds=round===1?166:150;$('#round').textContent=`第 ${round} 关`;$('#timer').textContent=format(seconds);running=true;paused=false;$('#pause').textContent='Ⅱ';timerId=setInterval(()=>{if(!running||paused)return;seconds--;$('#timer').textContent=format(seconds);if(seconds<=0)finish(false,'时间到了，再试一次！')},1000);ui()}function format(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function take(item){if(!running||paused||!items.includes(item))return;history.push({type:item.type,item,before:[...tray]});item.el.remove();items=items.filter(x=>x!==item);tray.push(item.type);if(tray.filter(x=>x===item.type).length===3)tray=tray.filter(x=>x!==item.type);ui();if(!items.length){finish(true);return}if(tray.length>=7)finish(false,'收纳格满了，再挑战一次吧！')}function finish(win,reason){running=false;clearInterval(timerId);modal(win?'通关成功！':'挑战结束',win?'梳妆台清空啦！准备进入下一关吗？':reason,win?'下一关':'再试一次',()=>{if(win)round++;start()})}$('#modalButton').onclick=()=>{$('#modal').classList.add('hidden');start()};$('#pause').onclick=()=>{if(!running)return;paused=!paused;$('#pause').textContent=paused?'▶':'Ⅱ';if(paused)modal('已暂停','整理一下思路，继续寻找三个相同的美妆物品。','继续游戏',()=>{paused=false;$('#pause').textContent='Ⅱ'})};$('#undo').onclick=()=>{if(!running||paused||!history.length||!counts.undo)return;const last=history.pop();counts.undo--;tray=last.before;last.item.el.style.zIndex=String(remaining+history.length+1);board.append(last.item.el);items.push(last.item);ui()};$('#shuffle').onclick=()=>{if(!running||paused||!counts.shuffle)return;counts.shuffle--;const types=items.map(x=>x.type).sort(()=>Math.random()-.5);items.forEach((item,i)=>{item.type=types[i];item.el.textContent=types[i];item.el.setAttribute('aria-label',types[i])});ui()};$('#remove').onclick=()=>{if(!running||paused||!counts.remove||!tray.length)return;counts.remove--;tray.splice(0,Math.min(3,tray.length));ui()};ui()})();
</script></body></html>
