<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17233d" />
    <title>云端冲刺</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MINI PARKOUR</p>
          <h1>云端冲刺</h1>
        </div>
        <div class="scoreboard" aria-live="polite">
          <div><span>得分</span><strong id="score">0000</strong></div>
          <div><span>最高</span><strong id="best">0000</strong></div>
        </div>
      </header>

      <section class="canvas-wrap" aria-label="云端冲刺游戏区域">
        <canvas id="game" width="960" height="540"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <span class="pill" id="overlayTag">准备起跑</span>
            <h2 id="overlayTitle">跃过障碍，冲向远方</h2>
            <p id="overlayText">按空格键、↑ 或点击屏幕跳跃，连续按两次可以二段跳。</p>
            <button id="startButton" type="button">开始游戏 <span>→</span></button>
          </div>
        </div>
        <button class="sound-button" id="soundButton" type="button" aria-label="切换音效">♪</button>
      </section>

      <footer class="controls">
        <div><kbd>SPACE</kbd><kbd>↑</kbd><span>跳跃 / 二段跳</span></div>
        <div class="status"><i></i><span>越跑越快，小心障碍</span></div>
      </footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
